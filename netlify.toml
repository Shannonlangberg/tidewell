# Next.js on Netlify. The runtime plugin is declared explicitly because this site was
# created before Next.js was in the repo, so Netlify never auto-enabled it. Without it,
# Netlify uploads the raw .next folder as static files and every page 404s.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Guest stay page: mirrors the headers() entry in next.config.mjs (there is no proxy.ts).
[[headers]]
  for = "/stay/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Parked Tidewell app: never indexed (mirrors the headers() entry in next.config.mjs).
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Planted HQ: private staff portal. Never indexed, never cached (mirrors next.config.mjs).
[[headers]]
  for = "/hq/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-store"
