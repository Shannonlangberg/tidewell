<!DOCTYPE html>
<!-- Netlify Forms detection only. Netlify scans static HTML at deploy time; the real form is
     rendered by React in components/EnquiryForm.tsx and posts here in the background.
     Keep the field names in sync with that component. -->
<html>
  <body>
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="address" />
      <input name="service" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
