# Runs on every pull request and every push to main. A failing check should block the merge
# (turn on branch protection for main in the repository settings to enforce it).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # The build needs no secrets: HQ pages are rendered on request, and these public values are placeholders.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build
      # Advisory only for now: reports known vulnerabilities without failing the run.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  database:
    name: Database tests (pgTAP, from scratch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local Supabase stack
        run: supabase start -x logflare,vector,imgproxy,edge-runtime,studio,mailpit,postgres-meta
      - name: Apply every migration from scratch
        run: supabase db reset
      - name: Run the whole database suite
        run: supabase test db
