<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Tidewell sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f4ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1f2a33;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f4ef;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="font-size:18px;line-height:1.4;font-weight:600;padding-bottom:16px;">Your Tidewell sign-in code</td>
            </tr>
            <tr>
              <td style="font-size:17px;line-height:1.6;padding-bottom:20px;">
                Type this code on the sign-in page. It works for ten minutes and only once.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 0 24px 0;">
                <span style="display:inline-block;font-size:34px;letter-spacing:8px;font-weight:700;font-variant-numeric:tabular-nums;padding:14px 20px;border:2px solid #1f2a33;border-radius:10px;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:1.6;color:#4a5560;">
                If you did not ask for a code, you can ignore this email. Nobody can sign in without it, and we will never ask you for it by phone or text.
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:1.6;color:#6b7680;padding-top:24px;">
                Tidewell. Holiday homes, kept well.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
